<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">MAC 연산 계산 흐름</title>
  <desc id="desc">입력 패턴과 필터의 같은 위치 값을 곱한 뒤 모든 결과를 더해 하나의 점수를 만드는 과정</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 28px 'Malgun Gothic', 'Noto Sans KR', sans-serif; fill: #0f172a; }
      .label { font: 700 20px 'Malgun Gothic', 'Noto Sans KR', sans-serif; fill: #1e293b; }
      .body { font: 16px 'Malgun Gothic', 'Noto Sans KR', sans-serif; fill: #334155; }
      .cell { font: 700 20px Consolas, monospace; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .small { font: 15px 'Malgun Gothic', 'Noto Sans KR', sans-serif; fill: #475569; text-anchor: middle; }
    </style>
  </defs>
  <rect width="1200" height="430" rx="22" fill="#f8fafc"/>
  <text x="48" y="52" class="title">MAC Multiply Accumulate 연산</text>
  <text x="48" y="82" class="body">같은 위치의 값을 곱하고 모든 곱셈 결과를 하나의 점수로 누적합니다.</text>

  <text x="135" y="125" class="label" text-anchor="middle">입력 패턴 P</text>
  <g transform="translate(60 145)">
    <rect width="150" height="150" rx="8" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
    <path d="M50 0V150 M100 0V150 M0 50H150 M0 100H150" stroke="#93c5fd" stroke-width="2"/>
    <g class="cell"><text x="25" y="25">0</text><text x="75" y="25">1</text><text x="125" y="25">0</text>
      <text x="25" y="75">1</text><text x="75" y="75">1</text><text x="125" y="75">1</text>
      <text x="25" y="125">0</text><text x="75" y="125">1</text><text x="125" y="125">0</text></g>
  </g>

  <text x="270" y="225" class="title" text-anchor="middle">×</text>

  <text x="405" y="125" class="label" text-anchor="middle">필터 F</text>
  <g transform="translate(330 145)">
    <rect width="150" height="150" rx="8" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
    <path d="M50 0V150 M100 0V150 M0 50H150 M0 100H150" stroke="#86efac" stroke-width="2"/>
    <g class="cell"><text x="25" y="25">0</text><text x="75" y="25">1</text><text x="125" y="25">0</text>
      <text x="25" y="75">1</text><text x="75" y="75">1</text><text x="125" y="75">1</text>
      <text x="25" y="125">0</text><text x="75" y="125">1</text><text x="125" y="125">0</text></g>
  </g>

  <line x1="505" y1="220" x2="590" y2="220" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="548" y="197" class="small">위치별 곱셈</text>

  <g transform="translate(610 145)">
    <rect width="250" height="150" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="125" y="34" class="label" text-anchor="middle">곱셈 결과</text>
    <text x="125" y="78" class="cell">0  1  0</text>
    <text x="125" y="108" class="cell">1  1  1</text>
    <text x="125" y="138" class="cell">0  1  0</text>
  </g>

  <line x1="880" y1="220" x2="958" y2="220" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="920" y="197" class="small">누적 덧셈</text>

  <g transform="translate(980 155)">
    <rect width="170" height="130" rx="18" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3"/>
    <text x="85" y="38" class="label" text-anchor="middle">MAC 점수</text>
    <text x="85" y="88" style="font:700 46px Consolas,monospace;fill:#6d28d9;text-anchor:middle">5</text>
    <text x="85" y="112" class="small">필터와 높은 일치</text>
  </g>

  <rect x="60" y="340" width="1090" height="54" rx="10" fill="#e2e8f0"/>
  <text x="605" y="373" class="label" text-anchor="middle">score = Σ P[r][c] × F[r][c]  ·  N×N 필터는 N²회의 MAC 수행</text>
</svg>
